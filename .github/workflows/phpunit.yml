name: AegisDock CI

on:
  push:
    branches: [master, develop, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: PHP and frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, pdo_sqlite, bcmath, gd, xml, sodium
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP tests
        working-directory: api
        run: ./vendor/bin/pest -c phpunit.xml

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Check frontend types
        working-directory: frontend
        run: npm test
