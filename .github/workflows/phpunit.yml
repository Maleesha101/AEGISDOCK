name: AegisDock CI

on:
  push:
    branches: [master, develop, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: PHP and frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, pdo_sqlite, bcmath, gd, xml, sodium
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare local test environment
        working-directory: api
        run: cp .env.example .env

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP tests
        working-directory: api
        run: ./vendor/bin/pest -c phpunit.xml

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Check frontend types
        working-directory: frontend
        run: npm test

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build vulnerable API image
        run: docker build --pull=false -t aegisdock/api:vulnerable -f docker/vulnerable/Dockerfile .

      - name: Build secure API image
        run: docker build --pull=false -t aegisdock/api:secure -f docker/secure/Dockerfile .

      - name: Build supporting service images
        run: |
          docker build --pull=false -t aegisdock/frontend ./frontend
          docker build --pull=false -t aegisdock/registry-simulator ./registry-simulator
          docker build --pull=false -t aegisdock/audit-service ./audit-service
