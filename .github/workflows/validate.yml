name: AegisDock validation

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pdo_mysql, pdo_sqlite, xml, gd, bcmath
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate Composer manifest
        working-directory: api
        run: composer validate --no-check-publish
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run API tests
        working-directory: api
        run: vendor/bin/pest -c phpunit.xml
      - name: PHP syntax checks
        run: find api/app api/bootstrap api/config api/database api/routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Type-check frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check Node service syntax
        run: |
          node --check registry-simulator/index.js
          node --check audit-service/index.js
