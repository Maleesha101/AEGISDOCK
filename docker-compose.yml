version: '3.8'

services:
  # Only the reverse proxy is published, and only on loopback.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=/api
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - aegisdock-net

  # Backend API - intentionally vulnerable behavior is confined to the lab.
  api:
    build:
      context: .
      dockerfile: docker/vulnerable/Dockerfile
    expose:
      - "80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=aegisdock
      - DB_USERNAME=aegisdock
      - DB_PASSWORD=aegisdock_secret
      - CRYPTO_KEY=TRAINING-FAKE-KEY-2025-ABCDEF1234567890ABCDEF12
      - CRYPTO_IV=TRAINING-FAKE-IV-1234567890ABC
    depends_on:
      postgres:
        condition: service_healthy
      registry-simulator:
        condition: service_started
    networks:
      - aegisdock-net

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - registry-simulator
      - audit-service
    networks:
      - aegisdock-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisdock
      POSTGRES_USER: aegisdock
      POSTGRES_PASSWORD: aegisdock_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisdock -d aegisdock"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "5432"
    networks:
      - aegisdock-net

  registry-simulator:
    build:
      context: ./registry-simulator
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - aegisdock-net

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    environment:
      - API_URL=http://api:80
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - aegisdock-net

networks:
  aegisdock-net:
    name: aegisdock-lab
    internal: true

volumes:
  postgres_data:
