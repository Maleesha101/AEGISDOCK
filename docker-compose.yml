version: '3.8'

services:
  # Browser traffic enters through the local Nginx gateway only.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - api
    networks:
      - aegisdock-net
    restart: unless-stopped

  # Laravel API. Kept off the host-published interface.
  api:
    image: aegisdock/api:vulnerable
    build:
      context: .
      dockerfile: docker/vulnerable/Dockerfile
    expose:
      - "80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-aegisdock}
      - DB_USERNAME=${POSTGRES_USER:-aegisdock}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-aegisdock_local_only}
      - CRYPTO_KEY=${CRYPTO_KEY:-AEGISDOCK-TRAINING-KEY-32-BYTES!}
      - CRYPTO_IV=${CRYPTO_IV:-AEGIS-STATIC-IV!}
    depends_on:
      postgres:
        condition: service_healthy
      registry-simulator:
        condition: service_started
    networks:
      - aegisdock-net
    restart: unless-stopped

  # Single host entry point. HTTPS is intentionally not advertised until
  # a local certificate configuration is implemented.
  nginx:
    image: nginx:alpine
    ports:
      - "${AEGISDOCK_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - registry-simulator
      - audit-service
    networks:
      - aegisdock-net
    restart: unless-stopped

  # PostgreSQL is only accessible on the Compose network.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aegisdock}
      - POSTGRES_USER=${POSTGRES_USER:-aegisdock}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegisdock_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegisdock-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisdock} -d ${POSTGRES_DB:-aegisdock}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local metadata/image registry simulator; no external registry is used.
  registry-simulator:
    build:
      context: ./registry-simulator
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./registry-simulator/artifacts:/artifacts:ro
    networks:
      - aegisdock-net
    restart: unless-stopped

  # Local audit simulation; never connects to physical terminal equipment.
  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - API_URL=http://api:80
    networks:
      - aegisdock-net
    depends_on:
      - api
    restart: unless-stopped

networks:
  aegisdock-net:
    driver: bridge

volumes:
  postgres_data:
